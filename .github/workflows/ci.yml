name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run black
      run: black --check src/ tests/
    
    - name: Run ruff
      run: ruff check src/ tests/
    
    - name: Run mypy
      run: mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: pytest tests/ -v --tb=short
    
    - name: Run demo script
      run: python scripts/demo.py

  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run smoke test
      run: |
        python -c "
        import sys
        sys.path.insert(0, 'src')
        from src.data.synthetic_dataset import SyntheticDataset
        from src.models.baseline_models import BaselineZeroShotModel
        from src.utils.device import get_device, set_seed
        
        print('✅ All imports successful')
        
        # Test basic functionality
        set_seed(42)
        device = get_device()
        print(f'✅ Device detection: {device}')
        
        # Test dataset
        dataset = SyntheticDataset(['A photo of a cat', 'A photo of a dog'], 5, (224, 224), split='test')
        print(f'✅ Dataset creation: {len(dataset)} samples')
        
        # Test model
        model = BaselineZeroShotModel(224*224*3, 128, 2)
        print(f'✅ Model creation: {model._count_parameters()} parameters')
        
        print('🎉 Smoke test passed!')
        "
